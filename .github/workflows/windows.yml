name: Windows build and release

on:
  pull_request:
  push:
    branches: [main]
    tags: ['v[0-9]+.[0-9]+.[0-9]+']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    name: Build Windows x64 installer
    runs-on: windows-2025
    timeout-minutes: 20
    defaults:
      run:
        shell: powershell
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Inno Setup 6.7.4
        run: |
          $installer = Join-Path $env:RUNNER_TEMP 'innosetup-6.7.4.exe'
          $url = 'https://github.com/jrsoftware/issrc/releases/download/is-6_7_4/innosetup-6.7.4.exe'
          $expected = 'a549929319f9120716677c685535ca4671e4b937b5fdc87e2585f32d8eb30e8c'
          Invoke-WebRequest -UseBasicParsing -Uri $url -OutFile $installer
          if ((Get-FileHash -LiteralPath $installer -Algorithm SHA256).Hash -ne $expected) {
              throw 'Inno Setup download failed SHA-256 verification.'
          }
          $installDir = Join-Path $env:RUNNER_TEMP 'mmoni-iscc'
          $arguments = @('/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART', '/SP-', ('"/DIR=' + $installDir + '"'))
          $process = Start-Process -FilePath $installer -ArgumentList $arguments -WindowStyle Hidden -Wait -PassThru
          if ($process.ExitCode -ne 0 -or -not (Test-Path (Join-Path $installDir 'ISCC.exe'))) {
              throw "Inno Setup installation failed with exit code $($process.ExitCode)."
          }

      - name: Build and checksum installer
        run: |
          $iscc = Join-Path $env:RUNNER_TEMP 'mmoni-iscc\ISCC.exe'
          ./native/scripts/build-installer-native.ps1 -Configuration Release -InnoCompiler $iscc
          $version = (Get-Item native/build/release/Mmoni.exe).VersionInfo.ProductVersion
          if ($env:GITHUB_REF_TYPE -eq 'tag' -and $env:GITHUB_REF_NAME -cne "v$version") {
              throw "Tag '$env:GITHUB_REF_NAME' must match the executable version, v$version."
          }
          $installer = Get-Item -LiteralPath "dist/Mmoni-Setup-$version-win-x64-native.exe"
          $hash = (Get-FileHash -LiteralPath $installer.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
          [IO.File]::WriteAllText("$($installer.FullName).sha256", "$hash  $($installer.Name)" + [char]10)

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: mmoni-windows-x64
          path: |
            dist/Mmoni-Setup-*-win-x64-native.exe
            dist/Mmoni-Setup-*-win-x64-native.exe.sha256
          if-no-files-found: error

  release:
    name: Publish GitHub Release
    if: github.event_name == 'push' && github.ref_type == 'tag'
    needs: package
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    concurrency:
      group: mmoni-release-${{ github.ref }}
      cancel-in-progress: false
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: mmoni-windows-x64
          path: release

      - name: Upload and publish release
        working-directory: release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          installer="Mmoni-Setup-${RELEASE_TAG#v}-win-x64-native.exe"
          checksum="$installer.sha256"
          sha256sum --check "$checksum"

          if draft=$(gh release view "$RELEASE_TAG" --json isDraft --jq '.isDraft'); then
              if [[ "$draft" == false ]]; then
                  assets=$(gh release view "$RELEASE_TAG" --json assets --jq '.assets[].name')
                  grep -Fxq "$installer" <<< "$assets"
                  grep -Fxq "$checksum" <<< "$assets"
                  echo "$RELEASE_TAG is already published with both assets."
                  exit 0
              fi
          else
              gh release create "$RELEASE_TAG" --verify-tag --draft --generate-notes --title "Mmoni $RELEASE_TAG"
          fi

          gh release upload "$RELEASE_TAG" "$installer" "$checksum" --clobber
          gh release edit "$RELEASE_TAG" --draft=false
